[package]
name = "kadr"
version = "0.1.0"
edition = "2024"
description = "The ffmpeg command, assembled as you watch"
readme = "README.md"
license = "MIT"
repository = "https://github.com/yand3r3d3v/kadr"
keywords = ["ffmpeg", "tui", "video", "cli"]
categories = ["command-line-utilities", "multimedia::video"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
ratatui = "0.30"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.25.15"

[profile.release]
lto = true
strip = true
